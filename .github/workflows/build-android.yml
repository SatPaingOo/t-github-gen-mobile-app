name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build per repo at a time (repo is single-purpose: one generated app)
concurrency:
  group: build-android
  cancel-in-progress: false

# release job creates a GitHub Release
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply app branding (app.config.json -> native configs/icons)
        run: node scripts/generate.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            # fallback: react-native gradle plugin may name it after the project
            APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK path: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: Android APK
          body: |
            Generated app — installable debug-signed APK.
          files: android/app/build/outputs/apk/release/*.apk
